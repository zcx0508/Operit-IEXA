# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=25 -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/operit-tools/tmp
# 2026-11-01 20:10 用户要求：堆从 3G 降到 2G、并发进一步压低，优先保证啵啵/QQ 网关正常运作。
# 时间不是问题 —— 宁可构建慢一倍，也不要抢内存抢 CPU。
# 配套：UseSerialGC（单线程 GC，少抢 CPU）、ActiveProcessorCount=2（编译线程数封顶）、
# org.gradle.parallel=true（不再并行跑任务）。K1 kapt（kapt.use.k2=false）是 2G 能跑的前提。
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
# 2026-11-01 03:20：上游默认 16，是本机 02:10 内存事故的诱因之一（多模块原生编译并发）。
# 这台 16GB 机器上 native 构建串行，宁可慢也不要把 IEXA / 网关拖崩。
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=640m -XX:+UseSerialGC -XX:ActiveProcessorCount=2
# 2026-11-01 03:40：:app:kaptDebugKotlin 在 kapt 增量缓存阶段炸
# java.lang.NullPointerException: processingEnv must not be null
#   at androidx.room.compiler.processing.javac.JavacBasicAnnotationProcessor...
#   at org.jetbrains.kotlin.kapt.base.incremental.IncrementalProcessor.getSupportedOptions
# kapt 在 init(processingEnv) 之前就给 Room 处理器取 supportedOptions，Room 2.8.4 这里会 NPE。
# 关掉 kapt 增量注解处理即可绕开（只影响增量速度，不影响产物）。
kapt.incremental.apt=false
# 2026-11-01 05:00：Kotlin 2.2.21 默认走 FIR（K2）kapt：
#   org.jetbrains.kotlin.kapt.FirKaptAnalysisHandlerExtension.generateKotlinSourceStubs
# 本项目 stub 生成在 K2 kapt 下极慢且吃内存（2.5G 堆时 2193 次 FullGC、70 分钟零产出）。
# 关掉 K2 kapt，回到传统 K1 kapt（更快、更省内存、处理器初始化顺序也正常）。
kapt.use.k2=false
# 2026-11-01 06:05：16GB 机器上「Gradle daemon 6G + Kotlin daemon 4G」双 JVM 峰值 ~7.7G，
# 叠加本机常驻的 IEXA/QQ/面板把可用内存压到 0.9G，看护两次强制中止构建。
# 改成 Kotlin 编译在 Gradle daemon 内执行（in-process），只留一个 JVM，峰值降约 2G。
kotlin.compiler.execution.strategy=in-process
# 2026-11-01 21:10：2G 堆下 compileReleaseKotlin 的 Old 区 100% 满、412 次 FullGC / 1669 秒（活锁）。
# 增量编译自身的缓存/映射对象是主要存活集之一，关掉它来压存活集；代价是全量重编（时间不是问题）。
# kotlin.incremental=false  # 21:15 实测无效（存活集压不下来），已回退